<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coal-or-Gift — 肌肉聖誕老人發禮物模擬器</title>
<style>
  :root {
    --bg1: #07102b; --bg2: #1c3a70; --gold: #ffd166; --red: #ff3b5c; --ink: #1a1030;
    --card: rgba(7,16,43,.58); --line: rgba(255,255,255,.2); --text: #f4f7ff; --dim: #c3cdea;
    --font: "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font); color: var(--text); overflow-x: hidden;
    background: linear-gradient(180deg, var(--bg1), var(--bg2) 70%, #3b5f95); background-attachment: fixed;
  }

  /* 背景:全版靜態圖輪播(兩層交叉淡入淡出)→ 暗色遮罩 → 飄雪 → 內容 */
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #07102b; }
  .bgimg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.4s ease; transform: scale(1); }
  .bgimg.on { opacity: 1; animation: kb 9s ease-out forwards; }
  @keyframes kb { from { transform: scale(1.0); } to { transform: scale(1.07); } }
  .scrim { position: absolute; inset: 0; background:
    radial-gradient(ellipse at 50% 42%, rgba(7,16,43,.55) 0%, rgba(7,16,43,.2) 55%, rgba(7,16,43,.05) 100%),
    linear-gradient(180deg, rgba(7,16,43,.35), rgba(7,16,43,0) 30%, rgba(7,16,43,0) 60%, rgba(7,16,43,.55)); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .ticker, .page { position: relative; z-index: 2; }

  /* 跑馬燈 */
  .ticker { overflow: hidden; background: var(--red); border-bottom: 3px solid var(--ink); white-space: nowrap; }
  .ticker .run { display: inline-block; padding: 7px 0; font-weight: 900; font-size: 14px; letter-spacing: .04em; animation: run 38s linear infinite; }
  .ticker span { margin: 0 28px; }
  @keyframes run { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .page { max-width: 1040px; margin: 0 auto; padding: 0 16px 62px; min-height: calc(100vh - 34px); display: flex; flex-direction: column; justify-content: center; }
  header { text-align: center; padding: 14px 0 6px; }
  /* 緞帶標籤 */
  .eyebrow { position: relative; display: inline-block; background: linear-gradient(180deg, #ffe08a, var(--gold)); color: var(--ink); font-weight: 900; font-size: 14px; letter-spacing: .06em;
             padding: 5px 26px; transform: rotate(-2deg); box-shadow: 0 3px 0 #b9892a, 0 8px 14px rgba(0,0,0,.35); border-top: 2px solid #fff3c4; }
  .eyebrow::before, .eyebrow::after { content: ""; position: absolute; top: 6px; width: 16px; height: 100%; background: #d9a21f; z-index: -1; }
  .eyebrow::before { left: -12px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 30% 50%); }
  .eyebrow::after { right: -12px; clip-path: polygon(0 0, 100% 0, 70% 50%, 100% 100%, 0 100%); }
  /* 標題 Logo:優先用美術字圖片 assets/ui/logo.png,載入失敗才顯示下面的 CSS 文字版 */
  .logo { margin: 16px 0 0; line-height: 1; animation: wob 3.2s ease-in-out infinite; }
  .logo img { display: block; margin: 0 auto; width: min(780px, 92vw); height: auto; filter: drop-shadow(0 6px 0 rgba(26,16,48,.55)); }   /* 平面風:只用不模糊的硬邊陰影 */
  .logo .fb { display: none; font-family: "Impact","Arial Black","Segoe UI Black",system-ui,sans-serif; font-weight: 900; font-size: clamp(48px, 10.5vw, 116px); letter-spacing: .01em;
              -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; filter: drop-shadow(0 6px 0 rgba(26,16,48,.6)); }
  .logo.noimg img { display: none; } .logo.noimg .fb { display: block; }
  .logo .fb .c { color: #2e2e38; text-shadow: 0 0 18px rgba(255,120,30,.9); }
  .logo .fb .o { font-size: .5em; color: #ffd166; margin: 0 .08em; }
  .logo .fb .g { color: #ff3b5c; }
  @keyframes wob { 0%,100% { transform: rotate(-1deg) scale(1); } 50% { transform: rotate(1deg) scale(1.025); } }
  .tag { margin: 10px 0 0; font-size: clamp(16px, 2.6vw, 22px); color: #fff; min-height: 1.6em; transition: opacity .35s; text-shadow: 0 2px 6px rgba(0,0,0,.7); }

  .cta-wrap { text-align: center; margin: 26px 0 10px; }
  .cta { display: inline-block; background: linear-gradient(180deg, #ff5a7a, #e0243f); color: #fff; font-weight: 900; font-size: clamp(26px, 5vw, 42px);
         padding: 16px 52px; border-radius: 20px; text-decoration: none; border: 4px solid var(--ink); box-shadow: 0 8px 0 var(--ink), 0 16px 28px rgba(0,0,0,.45);
         position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 12px;
         animation: pulse 1.4s ease-in-out infinite; transition: transform .1s, box-shadow .1s; }
  .cta img { height: 1.15em; width: auto; filter: drop-shadow(0 2px 0 rgba(26,16,48,.5)); }
  .cta::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-20deg); animation: shine 2.8s ease-in-out infinite; }
  @keyframes shine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
  .cta:hover { filter: brightness(1.12); } .cta:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--ink); }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .warn { display: table; margin: 16px auto 0; font-size: 13px; color: var(--dim); background: rgba(7,16,43,.7); padding: 6px 14px; border-radius: 999px; }
  .warn b { color: var(--gold); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 26px; max-width: 760px; width: 100%; align-self: center; }
  .card { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px 18px 14px; backdrop-filter: blur(6px); box-shadow: 0 10px 24px rgba(0,0,0,.35); overflow: hidden; }
  .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: linear-gradient(90deg, #ff3b5c, #ffd166, #3ad29f, #4cc9f0, #ff3b5c); }
  .card h2 { margin: 0 0 8px; font-size: 19px; color: var(--gold); display: flex; align-items: center; gap: 8px; }
  .card h2 small { color: var(--dim); font-weight: 400; font-size: 12px; }
  ol.board { list-style: none; margin: 0; padding: 0; }
  ol.board li { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px dashed var(--line); font-size: 15px; }
  ol.board li:last-child { border-bottom: 0; }
  ol.board .rk { font-size: 19px; } ol.board .sc { font-weight: 900; font-size: 19px; color: #fff; }
  ol.board .meta { color: var(--dim); font-size: 12px; text-align: right; line-height: 1.35; } ol.board li:first-child .sc { color: var(--gold); }
  .empty { color: var(--dim); font-size: 14px; padding: 8px 0; }
  .link { background: none; border: 0; color: var(--dim); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 8px; }
  ul.how { margin: 0; padding-left: 20px; line-height: 1.8; font-size: 14px; }
  ul.how li b.g { color: #9bf6a8; } ul.how li b.b { color: #ff9aa2; } ul.how li b.s { color: #ffb3de; }
  footer { text-align: center; color: var(--dim); font-size: 12px; margin-top: 22px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  /* 從雪地冒出來偷看的小孩與怪物(只在寬螢幕顯示) */
  .peek { position: fixed; bottom: 16px; z-index: 1; width: clamp(96px, 11vw, 176px); pointer-events: none; animation: bob 2.8s ease-in-out infinite; }
  .peek img { width: 100%; display: block; filter: drop-shadow(0 6px 8px rgba(0,0,0,.4)); }
  .peek.l1 { left: 1vw; } .peek.l2 { left: 11.5vw; animation-delay: -1.3s; width: clamp(84px, 9.5vw, 150px); }
  .peek.r1 { right: 1vw; animation-delay: -.6s; } .peek.r2 { right: 11.5vw; animation-delay: -2s; width: clamp(84px, 9.5vw, 150px); }
  @keyframes bob { 0%, 100% { transform: translateY(10px); } 50% { transform: translateY(-4px); } }
  .ground { position: fixed; left: 0; right: 0; bottom: 0; height: 38px; z-index: 1; pointer-events: none;
            background: radial-gradient(circle at 24px 0, #fff 0 22px, transparent 23px) 0 0 / 48px 38px repeat-x, linear-gradient(180deg, transparent 0 14px, #eef5ff 14px); filter: drop-shadow(0 -4px 6px rgba(0,0,0,.25)); }
  @media (max-width: 1000px) { .peek { display: none; } }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    .card { background: rgba(7,16,43,.4); backdrop-filter: blur(2px); }
    .cta { padding: 13px 34px; }
  }
  @media (prefers-reduced-motion: reduce) { .logo, .cta, .cta::after, .peek, .ticker .run { animation: none; } }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><div class="bgimg" id="bgA"></div><div class="bgimg" id="bgB"></div><div class="scrim"></div></div>
<canvas id="fx"></canvas>

<div class="ticker" aria-hidden="true"><div class="run" id="runline"></div></div>

<div class="peek l1" aria-hidden="true"><img src="assets/sprites/kid_good_a/happy.png" alt=""></div>
<div class="peek l2" aria-hidden="true"><img src="assets/sprites/goblin_a/smug.png" alt=""></div>
<div class="peek r2" aria-hidden="true"><img src="assets/sprites/thug_b/smug.png" alt=""></div>
<div class="peek r1" aria-hidden="true"><img src="assets/sprites/kid_good_b/happy.png" alt=""></div>
<div class="ground" aria-hidden="true"></div>

<main class="page">
  <header>
    <span class="eyebrow">聖誕老人發禮物模擬器 · 肌肉特別版</span>
    <h1 class="logo" id="logo">
      <img src="assets/ui/logo.png" alt="Coal-or-Gift" onerror="document.getElementById('logo').classList.add('noimg')">
      <span class="fb" aria-hidden="true"><span class="c">Coal</span><span class="o">-or-</span><span class="g">Gift</span></span>
    </h1>
    <p class="tag" id="tag"></p>
  </header>

  <div class="cta-wrap">
    <a class="cta" id="start" href="game.html"><img src="assets/sprites/items/gift_red.png" alt="">開始發禮物 <span>▶</span></a>
    <div class="warn">⚠ 本遊戲含<b>大量肌肉</b>。偽裝成小孩的聖誕老人可能出現在任何角落,<b>請勿毆打</b>。</div>
  </div>

  <section class="grid">
    <div class="card">
      <h2>🏆 歷史排行榜 <small>本機前 5 名</small></h2>
      <ol class="board" id="board"></ol>
      <button class="link" id="clear" hidden>清除紀錄</button>
    </div>
    <div class="card">
      <h2>📖 怎麼玩</h2>
      <ul class="how">
        <li><b class="g">乖孩子</b> → 丟<b>禮物</b>;<b class="b">壞孩子</b> → 砸<b>煤炭</b></li>
        <li>點擊畫面投擲;<b>1 / 2</b>、空白鍵、右鍵或按鈕切換物品</li>
        <li>連擊越高,分身越多,還會引來<b>雪怪</b>(切煤炭狂點!)</li>
        <li><b class="s">像小孩又像老人?</b>別打他!會被肌肉秀擋住畫面</li>
        <li>漏掉目標扣愛心,3 顆愛心用完就結束</li>
      </ul>
    </div>
  </section>

  <footer>© 肌肉聖誕老人健身協會 · 一局大約 2 分鐘,練完記得拉筋</footer>
</main>

<script src="js/scores.js"></script>
<script src="js/entry.js"></script>
</body>
</html>
