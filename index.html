<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>煤炭 or 禮物 — 肌肉聖誕老人發禮物模擬器</title>
<style>
  :root {
    --bg1: #07102b; --bg2: #1c3a70; --gold: #ffd166; --red: #ff3b5c; --ink: #1a1030;
    --card: rgba(7,16,43,.58); --line: rgba(255,255,255,.2); --text: #f4f7ff; --dim: #c3cdea;
    --font: "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font); color: var(--text); overflow-x: hidden;
    background: linear-gradient(180deg, var(--bg1), var(--bg2) 70%, #3b5f95); background-attachment: fixed;
  }

  /* 背景:全版靜態圖輪播(兩層交叉淡入淡出)→ 暗色遮罩 → 飄雪 → 內容 */
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #07102b; }
  .bgimg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.4s ease; transform: scale(1); }
  .bgimg.on { opacity: 1; animation: kb 9s ease-out forwards; }
  @keyframes kb { from { transform: scale(1.0); } to { transform: scale(1.07); } }
  .scrim { position: absolute; inset: 0; background:
    radial-gradient(ellipse at 50% 42%, rgba(7,16,43,.55) 0%, rgba(7,16,43,.2) 55%, rgba(7,16,43,.05) 100%),
    linear-gradient(180deg, rgba(7,16,43,.35), rgba(7,16,43,0) 30%, rgba(7,16,43,0) 60%, rgba(7,16,43,.55)); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .ticker, .page { position: relative; z-index: 2; }

  /* 跑馬燈 */
  .ticker { overflow: hidden; background: var(--red); border-bottom: 3px solid var(--ink); white-space: nowrap; }
  .ticker .run { display: inline-block; padding: 7px 0; font-weight: 900; font-size: 14px; letter-spacing: .04em; animation: run 38s linear infinite; }
  .ticker span { margin: 0 28px; }
  @keyframes run { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .page { max-width: 1040px; margin: 0 auto; padding: 0 16px 36px; min-height: calc(100vh - 34px); display: flex; flex-direction: column; justify-content: center; }
  header { text-align: center; padding: 18px 0 6px; }
  .eyebrow { display: inline-block; background: var(--gold); color: var(--ink); font-weight: 900; font-size: 13px; padding: 4px 12px; border-radius: 999px; transform: rotate(-3deg); }
  h1 { margin: 10px 0 0; font-size: clamp(54px, 12vw, 128px); line-height: 1.02; font-weight: 900; color: var(--gold);
       text-shadow: 0 5px 0 #7a1020, 0 0 2px #7a1020, 5px 8px 0 rgba(0,0,0,.4); -webkit-text-stroke: 4px #7a1020; paint-order: stroke fill;
       animation: wob 3s ease-in-out infinite; }
  h1 .or { font-size: .5em; color: #fff; margin: 0 .15em; }
  @keyframes wob { 0%,100% { transform: rotate(-1.2deg) scale(1); } 50% { transform: rotate(1.2deg) scale(1.03); } }
  .tag { margin: 12px 0 0; font-size: clamp(16px, 2.6vw, 22px); color: #fff; min-height: 1.6em; transition: opacity .35s; text-shadow: 0 2px 6px rgba(0,0,0,.7); }

  .cta-wrap { text-align: center; margin: 26px 0 10px; }
  .cta { display: inline-block; background: linear-gradient(180deg, #ff5a7a, #e0243f); color: #fff; font-weight: 900; font-size: clamp(26px, 5vw, 42px);
         padding: 16px 52px; border-radius: 20px; text-decoration: none; border: 4px solid var(--ink); box-shadow: 0 8px 0 var(--ink), 0 16px 28px rgba(0,0,0,.45);
         animation: pulse 1.4s ease-in-out infinite; transition: transform .1s, box-shadow .1s; }
  .cta:hover { filter: brightness(1.1); } .cta:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--ink); }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .warn { display: inline-block; margin-top: 14px; font-size: 13px; color: var(--dim); background: rgba(7,16,43,.7); padding: 6px 14px; border-radius: 999px; }
  .warn b { color: var(--gold); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 26px; max-width: 760px; width: 100%; align-self: center; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px 18px; backdrop-filter: blur(6px); }
  .card h2 { margin: 0 0 8px; font-size: 19px; color: var(--gold); display: flex; align-items: center; gap: 8px; }
  .card h2 small { color: var(--dim); font-weight: 400; font-size: 12px; }
  ol.board { list-style: none; margin: 0; padding: 0; }
  ol.board li { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px dashed var(--line); font-size: 15px; }
  ol.board li:last-child { border-bottom: 0; }
  ol.board .rk { font-size: 19px; } ol.board .sc { font-weight: 900; font-size: 19px; color: #fff; }
  ol.board .meta { color: var(--dim); font-size: 12px; text-align: right; line-height: 1.35; } ol.board li:first-child .sc { color: var(--gold); }
  .empty { color: var(--dim); font-size: 14px; padding: 8px 0; }
  .link { background: none; border: 0; color: var(--dim); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 8px; }
  ul.how { margin: 0; padding-left: 20px; line-height: 1.8; font-size: 14px; }
  ul.how li b.g { color: #9bf6a8; } ul.how li b.b { color: #ff9aa2; } ul.how li b.s { color: #ffb3de; }
  footer { text-align: center; color: var(--dim); font-size: 12px; margin-top: 22px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    .card { background: rgba(7,16,43,.4); backdrop-filter: blur(2px); }
    .cta { padding: 13px 34px; }
  }
  @media (prefers-reduced-motion: reduce) { h1, .cta, .ticker .run { animation: none; } }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><div class="bgimg" id="bgA"></div><div class="bgimg" id="bgB"></div><div class="scrim"></div></div>
<canvas id="fx"></canvas>

<div class="ticker" aria-hidden="true"><div class="run" id="runline"></div></div>

<main class="page">
  <header>
    <span class="eyebrow">聖誕老人發禮物模擬器 · 肌肉特別版</span>
    <h1>煤炭<span class="or">or</span>禮物</h1>
    <p class="tag" id="tag"></p>
  </header>

  <div class="cta-wrap">
    <a class="cta" id="start" href="game.html">開始發禮物 ▶</a>
    <div class="warn">⚠ 本遊戲含<b>大量肌肉</b>。偽裝成小孩的聖誕老人可能出現在任何角落,<b>請勿毆打</b>。</div>
  </div>

  <section class="grid">
    <div class="card">
      <h2>🏆 歷史排行榜 <small>本機前 5 名</small></h2>
      <ol class="board" id="board"></ol>
      <button class="link" id="clear" hidden>清除紀錄</button>
    </div>
    <div class="card">
      <h2>📖 怎麼玩</h2>
      <ul class="how">
        <li><b class="g">乖孩子</b> → 丟<b>禮物</b>;<b class="b">壞孩子</b> → 砸<b>煤炭</b></li>
        <li>點擊畫面投擲;<b>1 / 2</b>、空白鍵、右鍵或按鈕切換物品</li>
        <li>連擊越高,分身越多,還會引來<b>雪怪</b>(切煤炭狂點!)</li>
        <li><b class="s">像小孩又像老人?</b>別打他!會被肌肉秀擋住畫面</li>
        <li>漏掉目標扣愛心,3 顆愛心用完就結束</li>
      </ul>
    </div>
  </section>

  <footer>© 肌肉聖誕老人健身協會 · 一局大約 2 分鐘,練完記得拉筋</footer>
</main>

<script src="js/scores.js"></script>
<script src="js/entry.js"></script>
</body>
</html>
